  <rect x="0" y="0" width="940" height="500" rx="22" fill="#FCFBFF"/>
  <rect x="1" y="1" width="938" height="498" rx="21" fill="none" stroke="#ECEAF6"/>

  <text x="40" y="50" font-size="22" font-weight="700" fill="#161922">Integrations</text>
  <text x="40" y="74" font-size="13.5" fill="#6B7280">RootVector connects code, deploys and production telemetry.</text>

  <!-- connectors -->
  <path d="M230 268 C 380 268 410 94 556 94"   fill="none" stroke="#6D5AE6" stroke-width="2.4"/>
  <path d="M230 268 C 380 268 410 152 556 152" fill="none" stroke="#6D5AE6" stroke-width="2.4"/>
  <path d="M230 268 C 380 268 410 210 556 210" fill="none" stroke="#D6D3E8" stroke-width="2" stroke-dasharray="2 5"/>
  <path d="M230 268 C 380 268 410 268 556 268" fill="none" stroke="#D6D3E8" stroke-width="2" stroke-dasharray="2 5"/>
  <path d="M230 268 C 380 268 410 326 556 326" fill="none" stroke="#D6D3E8" stroke-width="2" stroke-dasharray="2 5"/>
  <path d="M230 268 C 380 268 410 384 556 384" fill="none" stroke="#D6D3E8" stroke-width="2" stroke-dasharray="2 5"/>
  <path d="M230 268 C 380 268 410 442 556 442" fill="none" stroke="#D6D3E8" stroke-width="2" stroke-dasharray="2 5"/>

  <!-- hub -->
  <g filter="url(#sh)"><rect x="70" y="230" width="160" height="76" rx="16" fill="url(#hub)"/></g>
  <g transform="translate(84,236) scale(0.85)" fill="none" stroke="#fff" stroke-width="2.4">
    <path d="M25 7C25 16 18 24 8 24C8 15 15 7 25 7Z" stroke-linejoin="round"/>
    <path d="M11.5 20.5C15 18.5 19 14.5 21.5 10" stroke-linecap="round"/>
    <circle cx="9.6" cy="22.4" r="1.75" fill="#fff" stroke="none"/>
  </g>
  <text x="120" y="263" font-size="15.5" font-weight="700" fill="#fff">rootvector</text>
  <text x="120" y="281" font-size="10.5" fill="#E7E2FF">AI incident agent</text>

