  <rect x="572" y="80" width="28" height="28" rx="8" fill="#24292F"/><text x="586" y="98" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">GH</text>
  <text x="612" y="99" font-size="14.5" font-weight="600" fill="#161922">GitHub</text>
