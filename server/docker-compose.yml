services:
  postgres:
    image: postgres:15-alpine
    container_name: rootvector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rootvector
    # Host port 5433 so it never clashes with the innovest Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - rootvector_pg:/var/lib/postgresql/data

volumes:
  rootvector_pg:
