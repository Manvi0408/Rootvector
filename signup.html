<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Create account · RootVector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M25 7C25 16 18 24 8 24C8 15 15 7 25 7Z' fill='none' stroke='%236D5AE6' stroke-width='2'/%3E%3Ccircle cx='9.6' cy='22.4' r='1.9' fill='%236D5AE6'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241F1B; --ink-2:#4A443E; --muted:#6E6A62;
  --indigo:#6D5AE6; --indigo-600:#5B49D6; --red:#DC2626; --green:#1F9D57;
  --serif:"Newsreader","Iowan Old Style",Palatino,Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sky:linear-gradient(168deg,#F7C089 0%,#F3B191 16%,#E3A9BE 40%,#BBA2DC 66%,#9184CE 100%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:url('assets/sky-clouds.svg') center/cover no-repeat fixed, var(--sky)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(50% 36% at 18% 10%,rgba(255,255,255,.16),transparent 70%),
    radial-gradient(80% 55% at 50% 112%,rgba(120,108,196,.38),transparent 70%)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
.brand-logo{display:flex;align-items:center;gap:9px;font-weight:750;font-size:23px;letter-spacing:-.03em;color:#fff}
.brand-logo .mk{width:29px;height:29px}
.topbar .right{font-size:14.5px;color:rgba(255,255,255,.92)}
.topbar .right a{color:#fff;font-weight:700;margin-left:4px;text-decoration:underline;text-underline-offset:3px}

.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 0}
.card{width:100%;max-width:480px;border-radius:26px;padding:38px 40px 26px;
  background:rgba(255,252,249,.55);backdrop-filter:blur(24px) saturate(1.15);-webkit-backdrop-filter:blur(24px) saturate(1.15);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 44px 100px -44px rgba(50,28,20,.55)}
.card .logo{display:flex;justify-content:center;margin:0 0 12px}
.card .logo svg{width:38px;height:38px;color:var(--indigo)}
.card h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,46px);letter-spacing:-.01em;text-align:center;margin:0 0 6px;color:#231E1A}
.card .sub{text-align:center;color:var(--ink-2);font-size:15.5px;margin:0 0 26px}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin:0 0 7px}
.field label .req{color:var(--red)}
.control{position:relative}
.control .lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#8A8690;pointer-events:none}
.input{width:100%;font:15px/1.4 var(--sans);color:var(--ink);
  background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);border-radius:13px;
  padding:14px 16px 14px 42px;transition:border-color .15s,box-shadow .15s,background .15s}
.input::placeholder{color:#918C85}
.input:focus{outline:0;background:rgba(255,255,255,.9);border-color:var(--indigo);box-shadow:0 0 0 3px rgba(109,90,230,.18)}
.input.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.14)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:#8A8690;display:flex;align-items:center;justify-content:center;border-radius:8px}
.eye:hover{color:var(--ink-2);background:rgba(0,0,0,.05)}
.err{display:none;color:var(--red);font-size:13px;margin:7px 2px 0}
.err.show{display:block}
.err a{color:var(--indigo);font-weight:600}

.btn-primary{width:100%;border:0;border-radius:13px;background:var(--indigo);color:#fff;font-size:16px;font-weight:600;padding:16px;margin-top:8px;transition:background .15s,transform .05s}
.btn-primary:hover{background:var(--indigo-600)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary[disabled]{opacity:.7;cursor:default}
.legal{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink-2);font-size:12.5px;margin:18px 0 4px;text-align:center}
.legal svg{width:14px;height:14px;flex:0 0 auto;color:var(--muted)}
.legal a{color:var(--indigo);font-weight:600}
.note{text-align:center;color:var(--green);font-size:13.5px;margin:14px 0 0;display:none}
.note.show{display:block}

@media(max-width:560px){
  .page{padding:16px}
  .card{padding:28px 22px 22px;border-radius:20px}
  body{background-attachment:scroll}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="brand-logo" href="index.html">
      <svg class="mk" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M25 7C25 16 18 24 8 24C8 15 15 7 25 7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M11.5 20.5C15 18.5 19 14.5 21.5 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="9.6" cy="22.4" r="1.75" fill="currentColor"/>
      </svg>
      <b>rootvector</b>
    </a>
    <div class="right">Already have an account? <a href="login.html">Log in</a></div>
  </div>

  <div class="wrap">
    <form class="card" id="card" novalidate>
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M25 7C25 16 18 24 8 24C8 15 15 7 25 7Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M11.5 20.5C15 18.5 19 14.5 21.5 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="9.6" cy="22.4" r="1.9" fill="currentColor"/>
        </svg>
      </div>
      <h1>Create account</h1>
      <p class="sub">Get started with RootVector</p>

      <div class="field">
        <label for="first">First name <span class="req">*</span></label>
        <div class="control">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input class="input" id="first" type="text" autocomplete="given-name" placeholder="Enter your first name" required>
        </div>
        <p class="err" id="firstErr">Please enter your first name.</p>
      </div>

      <div class="field">
        <label for="last">Last name <span class="req">*</span></label>
        <div class="control">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input class="input" id="last" type="text" autocomplete="family-name" placeholder="Enter your last name" required>
        </div>
        <p class="err" id="lastErr">Please enter your last name.</p>
      </div>

      <div class="field">
        <label for="email">Work email <span class="req">*</span></label>
        <div class="control">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="Enter your work email" required>
        </div>
        <p class="err" id="emailErr"></p>
      </div>

      <div class="field">
        <label for="pass">Password <span class="req">*</span></label>
        <div class="control">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input class="input" id="pass" type="password" autocomplete="new-password" placeholder="Create your password" required style="padding-right:46px">
          <button class="eye" id="eye" type="button" aria-label="Show password">
            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" hidden><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 5.2A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4M6.1 6.1A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 3-.5"/></svg>
          </button>
        </div>
        <p class="err" id="passErr"></p>
      </div>

      <button class="btn-primary" id="submit" type="submit">Create account →</button>

      <p class="note" id="note"></p>
      <p class="legal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </p>
    </form>
  </div>
</div>

<script>
const $ = s => document.getElementById(s);

/* prefill email if the user came from the "create an account" link on login */
try {
  const pre = sessionStorage.getItem("rv_prefill_email");
  if(pre){ $("email").value = pre; sessionStorage.removeItem("rv_prefill_email"); }
} catch(e){}

/* password visibility */
$("eye").addEventListener("click", () => {
  const p = $("pass"), open = $("eyeOpen"), off = $("eyeOff");
  const show = p.type === "password";
  p.type = show ? "text" : "password";
  open.hidden = show; off.hidden = !show;
  $("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
});

/* clear error styling while typing */
["first","last","email","pass"].forEach(id => $(id).addEventListener("input", () => {
  $(id).classList.remove("bad");
  const e = $(id + "Err"); if(e) e.classList.remove("show");
}));

function fail(id, errId, html){ $(id).classList.add("bad"); const e = $(errId); if(html!==undefined) e.innerHTML = html; e.classList.add("show"); }
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
/* Local dev serves the frontend on :4178 (separate backend on :4000).
   In production the backend serves this page itself, so use a same-origin path. */
const API_BASE = (location.port === "4178" || location.protocol === "file:")
  ? "http://localhost:4000/api"
  : "/api";

$("card").addEventListener("submit", async e => {
  e.preventDefault();
  const first = $("first").value.trim();
  const last  = $("last").value.trim();
  const email = $("email").value.trim().toLowerCase();
  const pass  = $("pass").value;

  let ok = true;
  if(!first){ fail("first","firstErr"); ok = false; }
  if(!last){ fail("last","lastErr"); ok = false; }
  if(!validEmail(email)){ fail("email","emailErr","Enter a valid email address."); ok = false; }
  // each account sets its own unique password — enforce a minimum strength
  if(pass.length < 8){ fail("pass","passErr","Password must be at least 8 characters."); ok = false; }
  else if(!/[A-Za-z]/.test(pass) || !/[0-9]/.test(pass)){ fail("pass","passErr","Use at least one letter and one number."); ok = false; }
  if(!ok) return;

  const n = $("note"); n.style.color=""; n.textContent = "Creating your account…"; n.classList.add("show");
  $("submit").disabled = true; $("submit").textContent = "…";
  try {
    const res = await fetch(API_BASE + "/auth/signup", {
      method:"POST", credentials:"include",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ email, password: pass, firstName: first, lastName: last })
    });
    if(res.ok){ location.href = "app.html?t=" + Date.now(); return; }
    $("submit").disabled = false; $("submit").textContent = "Create account →";
    if(res.status === 409){
      n.classList.remove("show");
      fail("email","emailErr","An account with this email already exists. <a href=\"login.html\">Log in →</a>");
    } else {
      n.style.color="var(--red)"; n.textContent = "Could not create the account.";
    }
  } catch(err){
    $("submit").disabled = false; $("submit").textContent = "Create account →";
    n.style.color="var(--red)"; n.textContent = "Can't reach the RootVector server.";
  }
});
</script>
</body>
</html>
